<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- DeFlix: a play button whose corners are peers. The triangle is the
       film, the nodes are the network it streams from. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A4BDB"/>
      <stop offset=".55" stop-color="#5954CD"/>
      <stop offset="1" stop-color="#31BDC6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <path d="M26 21 L45 32 L26 43 Z" fill="#FEFEFE" stroke="#FEFEFE" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="26" cy="21" r="4.6" fill="#69E9F5"/>
  <circle cx="45" cy="32" r="4.6" fill="#69E9F5"/>
  <circle cx="26" cy="43" r="4.6" fill="#69E9F5"/>
</svg>
